name: Auto Update Playlist

on:
  schedule:
    # Din mein 4 baar run hoga (Har 6 ghante par: 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Aap ise manually bhi GitHub action tab se run kar sakte hain

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Merge Script
        run: python merge_playlists.py

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto-update combined playlist.m3u" && git push)
